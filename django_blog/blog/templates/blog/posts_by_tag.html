{% extends 'blog/base.html' %}
{% csrf_token %}
{% block content %}
  <h2>Posts tagged with "{{ tag }}"</h2>
  {% if posts %}
    <ul>
      {% for post in posts %}
        <li><a href="{% url 'post-detail' post.pk %}">{{ post.title }}</a></li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No posts found with this tag.</p>
  {% endif %}
{% endblock %}
