{% extends "blog/base.html" %}
{# Template for confirming comment deletion #}
<h2>Are you sure you want to delete this comment?</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'post-detail' comment.post.pk %}">Cancel</a>  {# Link back to the post detail page #}
</form>
